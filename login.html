<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Welcome Holidays</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Sign in</h1>

    <div class="auth-container">
      <form id="loginForm">
        <label>Email
          <input id="loginEmail" type="email" required />
        </label>

        <label>Password
          <input id="loginPassword" type="password" required minlength="6" />
        </label>

        <label class="row"><input id="loginRemember" type="checkbox" /> Remember me</label>

        <div class="actions">
          <button type="submit" class="submit-btn">Sign in</button>
          <a class="link" href="signup.html">Create account</a>
        </div>

        <div id="loginMsg" class="form-msg"></div>
      </form>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
