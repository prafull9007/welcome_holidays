<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Welcome — Holidays</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css" />
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
	<main class="container">
		<h1 id="welcome">Welcome!</h1>

		<div id="authActions" class="auth-actions">
			<a class="submit-btn" href="login.html">Sign in</a>
			<a class="link" href="signup.html">Sign up</a>
		</div>

		<button id="signOutBtn" class="link" style="display:none;margin-left:12px;">Sign out</button>

		<section class="controls" id="appControls" style="display:none;">
			<label for="monthSelect">Select month:</label>
			<select id="monthSelect"></select>
		</section>

		<section class="content" id="appContent" style="display:none;">
			<div class="holidays">
				<h2>Holidays this month <span id="holMonth" class="month-name"></span></h2>
				<ul id="holidayList"></ul>
			</div>
			<div class="chart">
				<canvas id="holChart" width="600" height="300"></canvas>
			</div>
		</section>
	</main>

	<script src="auth.js"></script>
	<script src="app.js"></script>
</body>
</html>
